<title id="vga_timing-title">640 x 480 sync timing</title>
<desc id="vga_timing-desc">VGA 640 x 480 at 60 Hz: each line is 640 active pixels, 16 front porch, 96 sync and 48 back porch, and each frame is 480 active lines, 10 front porch, 2 sync and 33 back porch, with sync active low.</desc>
