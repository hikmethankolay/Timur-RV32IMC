<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 664" width="856" height="664" role="img" aria-labelledby="ahb_fabric-title ahb_fabric-desc" font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="ahb_fabric-title">The AHB-Lite fabric</title>
<desc id="ahb_fabric-desc">AHB-Lite fabric: two masters request the bus from the arbiter, the bus mux forwards the owner&#x27;s address and write data, the decoder selects one of five slaves, and the return path sends the selected slave&#x27;s read data and ready back to the masters.</desc>
