    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);

      justify-content: center;
      padding: 3rem 2rem;

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    svg { width: 100%; min-width: 856px; display: block; }

      .diagram-container { overflow-x: visible; }

  <div class="frame">
    <p class="eyebrow">Layer stack · rtl/bus/ahb_decoder.v</p>
    <h1>Memory map</h1>
    <p class="lede">The AHB decoder looks at HADDR[31:16]; the APB bridge splits its 64 KB window into 256-byte pages on PADDR[15:8].</p>
