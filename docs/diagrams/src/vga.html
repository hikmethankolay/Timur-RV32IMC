    <h1>The VGA controller</h1>
    <p class="lede">Beam counters, the shared framebuffer read port, the pixel pipeline and the registers.</p>

<title id="vga-title">The VGA controller</title>
<desc id="vga-desc">VGA controller: AHB writes and reads share the framebuffer with a video fetch slot driven by the beam counters; each fetched word feeds the pixel pipeline through a 16-entry palette to the VGA pins, and APB registers set the palette and scroll.</desc>
