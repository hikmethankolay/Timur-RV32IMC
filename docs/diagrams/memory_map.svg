<!-- none -->
<rect x="496" y="296" width="304" height="40" rx="6" fill="#fafafa"/>
<rect x="496" y="296" width="304" height="40" rx="6" fill="url(#hatch)" stroke="#d4d4d8" stroke-width="1.0"/>
