<text x="508" y="209.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="start">SRC 0x00, DST 0x04, LEN 0x08</text>
