<text x="508" y="107.8" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="start">DATA 0x00, STATUS 0x04, CTRL 0x08</text>
