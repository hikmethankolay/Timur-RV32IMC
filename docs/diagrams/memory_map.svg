<text x="68" y="235.8" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="start">0x3000_0000 - 0x3000_FFFF, 38,400 B used</text>
