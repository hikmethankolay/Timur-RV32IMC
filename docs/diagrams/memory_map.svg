<text x="496" y="358" fill="#52525b" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="start">Page on PADDR[15:8], register on PADDR[7:2].</text>
