<text x="68" y="100.5" fill="#71717a" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="start">unmapped: reads 0, writes ignored</text>
