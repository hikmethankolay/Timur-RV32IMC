<text x="660" y="549.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">or timur_fatal:</text>
<text x="660" y="562.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">report and stop</text>
<!-- mret -->
<rect x="560" y="616" width="200" height="56" rx="6" fill="#fafafa"/>
<rect x="560" y="616" width="200" height="56" rx="6" fill="#ffffff" stroke="#3f3f46" stroke-width="1.0" stroke-dasharray="4,3"/>
