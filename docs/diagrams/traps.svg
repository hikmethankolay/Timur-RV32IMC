<text x="392" y="469.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">trap.c</text>
<text x="392" y="482.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">dispatch on mcause</text>
<!-- sys -->
<rect x="560" y="352" width="200" height="64" rx="6" fill="#fafafa"/>
<rect x="560" y="352" width="200" height="64" rx="6" fill="#ffffff" stroke="#3f3f46" stroke-width="1.0"/>
<text x="660" y="373.3" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">ECALL: system call</text>
<text x="660" y="389.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">read, write, exit</text>
<text x="660" y="402.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">mepc += 4</text>
