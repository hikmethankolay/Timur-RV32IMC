<text x="148" y="104.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">external interrupt:</text>
<text x="148" y="117.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">UART rx or DMA done</text>
<text x="148" y="130.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">illegal instr., EBREAK,</text>
<text x="148" y="143.3" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">ECALL, misaligned ld/st</text>
<!-- tu -->
<rect x="296" y="72" width="192" height="80" rx="6" fill="#fafafa"/>
<rect x="296" y="72" width="192" height="80" rx="6" fill="#eef2fd" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="392" y="94.8" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">trap_unit</text>
<text x="392" y="110.8" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">picks one cause by priority;</text>
<text x="392" y="123.8" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">an interrupt waits while</text>
<text x="392" y="136.8" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">MUL or DIV is in EX</text>
<!-- csr -->
<rect x="560" y="72" width="200" height="80" rx="6" fill="#fafafa"/>
<rect x="560" y="72" width="200" height="80" rx="6" fill="#ffffff" stroke="#3f3f46" stroke-width="1.0"/>
<text x="660" y="94.8" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">csr_file</text>
<text x="660" y="110.8" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">mepc = PC in EX</text>
<text x="660" y="123.8" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">mcause, mtval</text>
<text x="660" y="136.8" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">MPIE = MIE, MIE = 0</text>
